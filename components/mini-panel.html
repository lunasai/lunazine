<!-- component: mini-panel -->
<!--
  Credential sidebar panel: Streamline Pixel icon + employment timeline + CV download.
  Figma source: node 458:3392 "mini panel"

  Requires:
    css/tokens.css
    css/component-button.css
    css/component-mini-panel.css

  Symbol dependency:
    <use href="#pixel-icon-archive-books"> resolves against the inline SVG sprite
    in index.html (sprite block, after #metric-badge-star).
    Preview pages must include that <symbol> independently —
    see previews/mini-panel.html for an example.

  Scroll-reveal:
    js/work-slides.js adds .is-visible to .mini-panel__icon-stage and each
    .mini-panel__row once the panel enters the viewport.
-->

<aside class="mini-panel" aria-label="Career timeline">

  <!-- Icon stage: pixel-art archive illustration (decorative) -->
  <div class="mini-panel__icon-stage" aria-hidden="true">
    <div class="mini-panel__bg"></div>
    <svg class="mini-panel__icon" viewBox="0 0 80 80" focusable="false" aria-hidden="true">
      <use href="#pixel-icon-archive-books"></use>
    </svg>
  </div>

  <!-- Employment timeline + CTA -->
  <div class="mini-panel__timeline" role="list" aria-label="Employment history">

    <div class="mini-panel__row" role="listitem">
      <span class="mini-panel__row-label">Heineken</span>
      <span class="mini-panel__row-value">S/2022</span>
    </div>

    <div class="mini-panel__row" role="listitem">
      <span class="mini-panel__row-label">Adidas</span>
      <span class="mini-panel__row-value">2019–2022</span>
    </div>

    <div class="mini-panel__row" role="listitem">
      <span class="mini-panel__row-label">Aegon/HCL</span>
      <span class="mini-panel__row-value">2016–2019</span>
    </div>

    <div class="mini-panel__row mini-panel__row--cta" role="listitem">
      <span class="mini-panel__row-label">and more</span>
      <a
        class="button button--bold"
        href="brand_ref/docs/LunaBorgo_Designer_CV.pdf"
        download="LunaBorgo_Designer_CV.pdf"
        aria-label="Download CV as PDF"
      >download cv</a>
    </div>

  </div>

</aside>
