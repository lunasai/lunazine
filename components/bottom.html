<!-- component-bottom.html -->
<!-- Requires: css/tokens.css, css/component-button.css, css/component-bottom.css -->

<footer class="bottom" aria-label="Footer status bar">
  <button
    type="button"
    class="button button--chrome bottom__contact js-copy-email"
    data-email="lunaborgo@gmail.com"
    aria-label="Copy email lunaborgo@gmail.com to clipboard"
    data-tooltip="Tap to copy"
  >
    <span class="button__face button__face--default">email me</span>
    <span class="button__face button__face--feedback" aria-live="polite">
      <svg class="button__feedback-thumb" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <use href="#figma-pixel-hand-awesome"></use>
      </svg>
      <span class="button__feedback-label">copied</span>
    </span>
  </button>

  <time class="bottom__time" datetime="22:00:00" data-tooltip="Luna's current timezone">22:00:00 AMS</time>

  <div class="bottom__mode" aria-label="Theme toggle">
    <button class="button button--chrome" type="button" aria-pressed="false">light</button>
    <button class="button button--chrome" type="button" aria-pressed="true">dark</button>
  </div>
</footer>
