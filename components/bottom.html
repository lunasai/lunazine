<footer class="bottom" aria-label="Footer status bar">
  <button
    type="button"
    class="button bottom__contact js-copy-email"
    data-email="lunaborgo@gmail.com"
    data-copied-text="email copied"
    aria-label="Copy email lunaborgo@gmail.com to clipboard"
    data-tooltip="tap to copy"
  >email me</button>

  <time class="bottom__time" datetime="22:00:00" data-tooltip="luna's current timezone">22:00:00 AMS</time>

  <div class="bottom__mode" aria-label="Theme toggle">
    <button class="button" type="button" aria-pressed="true">dark</button>
    <button class="button" type="button" aria-pressed="false">light</button>
  </div>
</footer>
