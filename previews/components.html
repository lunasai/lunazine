<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Components preview</title>

    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/component-navbar.css" />
    <link rel="stylesheet" href="../css/component-button.css" />
    <link rel="stylesheet" href="../css/component-bottom.css" />
    <link rel="stylesheet" href="../css/component-scroll-section.css" />

    <style>
      body {
        margin: 0;
        padding: var(--spacing-margin);
        background: var(--color-neutral-bg);
        color: var(--color-neutral-fg);
      }

      .page {
        display: grid;
        gap: var(--space-12);
        max-width: 1360px;
        margin: 0 auto;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-6);
        padding-bottom: var(--space-6);
        border-bottom: 1px solid var(--color-neutral-stroke-subtle);
      }

      .toolbar__title {
        font-family: var(--font-mono);
        font-weight: var(--font-weight-regular);
        font-size: var(--typography-mono);
        line-height: var(--line-height-normal);
        letter-spacing: var(--letter-spacing-mono);
        text-transform: uppercase;
        color: var(--color-neutral-fg-muted);
        margin: 0;
      }

      .toolbar__actions {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
      }

      .section {
        display: grid;
        gap: var(--space-6);
      }

      .section__heading {
        font-family: var(--font-mono);
        font-weight: var(--font-weight-regular);
        font-size: var(--typography-mono);
        line-height: var(--line-height-normal);
        letter-spacing: var(--letter-spacing-mono);
        text-transform: uppercase;
        color: var(--color-neutral-fg-muted);
        margin: 0;
      }

      .scroll-grid {
        display: flex;
        gap: var(--space-8);
        flex-wrap: wrap;
        align-items: flex-start;
      }

      .scroll-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-2);
      }

      .scroll-label {
        font-family: var(--font-mono);
        font-weight: var(--font-weight-regular);
        font-size: var(--typography-mono);
        line-height: var(--line-height-normal);
        letter-spacing: var(--letter-spacing-mono);
        text-transform: uppercase;
        color: var(--color-neutral-fg-muted);
      }
    </style>
  </head>
  <body>

    <div class="page">
      <div class="toolbar" role="region" aria-label="Preview toolbar">
        <p class="toolbar__title">Components preview</p>
        <div class="toolbar__actions">
          <button class="button button--chrome" type="button" id="themeToggle" aria-pressed="false">light</button>
        </div>
      </div>

      <section class="section" aria-label="Navbar component">
        <h2 class="section__heading">Navbar</h2>
        <header class="navbar" role="banner" aria-label="Site header">
          <a class="navbar__brand" href="/" aria-label="Home">
            <span class="navbar__name">luna</span>
            <span class="navbar__logo-mark" aria-hidden="true">
              <svg class="navbar__logo-svg" width="16" height="16" focusable="false" aria-hidden="true">
                <use id="moon-logo-use" href="#moon-full-moon" />
              </svg>
            </span>
            <span class="navbar__logo-type">product & systems designer</span>
          </a>

          <nav class="navbar__nav" aria-label="Primary navigation">
            <ul class="navbar__nav-list">
              <li><a class="button button--chrome" href="#work">work</a></li>
              <li><a class="button button--chrome" href="#about">about</a></li>
            </ul>
          </nav>
        </header>
      </section>

      <section class="section" aria-label="Button component">
        <h2 class="section__heading">Button</h2>
        <div style="display:flex; gap: var(--space-6); flex-wrap: wrap; align-items: center;">
          <button class="button" type="button">contact</button>
          <button class="button button--accent" type="button">contact</button>
          <button class="button button--hover" type="button">contact</button>
        </div>
      </section>

      <section class="section" aria-label="Bottom component">
        <h2 class="section__heading">Bottom</h2>
        <footer class="bottom" aria-label="Footer status bar">
          <div class="bottom__moonphase" aria-label="Current moon phase">
            <span aria-hidden="true">◑</span>
            <span>w. crescent</span>
          </div>

          <time class="bottom__time" datetime="22:00:00">22:00:00 AMS</time>

          <div class="bottom__mode" aria-label="Theme toggle">
            <button class="button button--chrome" type="button" aria-pressed="false">light</button>
            <button class="button button--chrome" type="button" aria-pressed="true">dark</button>
          </div>
        </footer>
      </section>

      <section class="section" aria-label="Scroll indicator component">
        <h2 class="section__heading">Scroll indicator</h2>
        <div class="scroll-grid" aria-label="Scroll indicator variants">
          <div class="scroll-item">
            <div class="scroll-label">Step=10</div>
            <div class="scroll-section" data-step="10" aria-label="Scroll progress indicator (Step 10)">
              <span class="scroll-section__segment" aria-hidden="true"></span>
              <span class="scroll-section__segment" aria-hidden="true"></span>
              <span class="scroll-section__segment" aria-hidden="true"></span>
            </div>
          </div>
          <div class="scroll-item">
            <div class="scroll-label">Step=15</div>
            <div class="scroll-section" data-step="15" aria-label="Scroll progress indicator (Step 15)">
              <span class="scroll-section__segment" aria-hidden="true"></span>
              <span class="scroll-section__segment" aria-hidden="true"></span>
              <span class="scroll-section__segment" aria-hidden="true"></span>
            </div>
          </div>
          <div class="scroll-item">
            <div class="scroll-label">Step=20</div>
            <div class="scroll-section" data-step="20" aria-label="Scroll progress indicator (Step 20)">
              <span class="scroll-section__segment" aria-hidden="true"></span>
              <span class="scroll-section__segment" aria-hidden="true"></span>
              <span class="scroll-section__segment" aria-hidden="true"></span>
            </div>
          </div>

            <div class="scroll-label">Step=25</div>
            <div class="scroll-section" data-step="25" aria-label="Scroll progress indicator (Step 25)">
              <span class="scroll-section__segment" aria-hidden="true"></span>
              <span class="scroll-section__segment" aria-hidden="true"></span>
              <span class="scroll-section__segment" aria-hidden="true"></span>
            </div>
          </div>
          <div class="scroll-item">
            <div class="scroll-label">Step=30</div>
            <div class="scroll-section" data-step="30" aria-label="Scroll progress indicator (Step 30)">
              <span class="scroll-section__segment" aria-hidden="true"></span>
              <span class="scroll-section__segment" aria-hidden="true"></span>
              <span class="scroll-section__segment" aria-hidden="true"></span>
            </div>
          </div>
          <div class="scroll-item">
            <div class="scroll-label">Step=35</div>
            <div class="scroll-section" data-step="35" aria-label="Scroll progress indicator (Step 35)">
              <span class="scroll-section__segment" aria-hidden="true"></span>
              <span class="scroll-section__segment" aria-hidden="true"></span>
              <span class="scroll-section__segment" aria-hidden="true"></span>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      (function () {
        const root = document.documentElement;
        const btn = document.getElementById("themeToggle");

        function setTheme(theme) {
          if (theme === "light") {
            root.setAttribute("data-theme", "light");
            btn.textContent = "dark";
            btn.setAttribute("aria-pressed", "true");
          } else {
            root.setAttribute("data-theme", "dark");
            btn.textContent = "light";
            btn.setAttribute("aria-pressed", "false");
          }
          localStorage.setItem("theme", theme);
        }

        const saved = localStorage.getItem("theme");
        setTheme(saved === "light" ? "light" : "dark");

        btn.addEventListener("click", function () {
          const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
          setTheme(next);
        });
      })();
    </script>
    <script src="../js/bottom-clock.js" defer></script>
  </body>
</html>
