<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Experience panel preview</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/component-button.css" />
    <link rel="stylesheet" href="../css/component-experience-panel.css" />

    <style>
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      body {
        margin: 0;
        background: var(--color-neutral-bg);
        color: var(--color-neutral-fg);
        font-family: var(--font-mono);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: var(--space-10) var(--spacing-margin);
        box-sizing: border-box;
        min-height: 100vh;
      }

      .preview-label {
        width: 320px;
        padding-bottom: var(--space-4);
        font-size: var(--typography-mono);
        line-height: var(--line-height-normal);
        letter-spacing: var(--letter-spacing-mono);
        text-transform: uppercase;
        color: var(--color-neutral-fg-muted);
      }

      .preview-frame {
        width: 320px;
      }
    </style>
  </head>
  <body>

    <p class="preview-label">Experience panel</p>

    <div class="preview-frame">
      <aside class="experience-panel" aria-label="Career timeline">

        <div class="experience-panel__container">
          <div class="experience-panel__bg"></div>
          <div class="experience-panel__content">
            <h2 class="work__title">in ancient times</h2>
            <div class="work__body">
              <p>Preview copy for the credential panel layout.</p>
            </div>

            <div class="experience-panel__timeline" role="list" aria-label="Employment history">

              <div class="experience-panel__row is-visible" role="listitem">
                <span class="experience-panel__row-label">Heineken</span>
                <span class="experience-panel__row-value">S/2022</span>
              </div>

              <div class="experience-panel__row is-visible" role="listitem">
                <span class="experience-panel__row-label">Adidas</span>
                <span class="experience-panel__row-value">2019-2022</span>
              </div>

              <div class="experience-panel__row is-visible" role="listitem">
                <span class="experience-panel__row-label">Aegon/HCL</span>
                <span class="experience-panel__row-value">2016-2019</span>
              </div>

              <div class="experience-panel__row experience-panel__row--cta is-visible" role="listitem">
                <span class="experience-panel__row-label">and more</span>
                <a
                  class="button button--bold"
                  href="../brand_ref/docs/LunaBorgo_Designer_CV.pdf"
                  download="LunaBorgo_Designer_CV.pdf"
                  aria-label="Download CV as PDF"
                >download cv</a>
              </div>

            </div>
          </div>
        </div>

      </aside>
    </div>

  </body>
</html>
